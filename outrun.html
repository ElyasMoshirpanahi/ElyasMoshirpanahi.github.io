<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outrun Synthgrid - Animated</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
        }
        canvas {
            display: block;
        }
        #info {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: #ff00ff;
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow: 0 0 10px #ff00ff, 0 0 20px #ff00ff;
            pointer-events: none;
            z-index: 1;
            animation: flicker 2s infinite alternate;
        }
        @keyframes flicker {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
                opacity: 1;
                text-shadow: 0 0 10px #ff00ff, 0 0 20px #ff00ff;
            }
            20%, 24%, 55% {
                opacity: 0.5;
                text-shadow: none;
            }
        }
        #error-msg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #ff0000;
            background: rgba(0,0,0,0.8);
            padding: 20px;
            border: 1px solid #ff0000;
            display: none;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="info">Outrun System Online</div>
    <div id="error-msg"></div>
    
    <script>
        window.addEventListener('error', function(e) {
            const msg = document.getElementById('error-msg');
            msg.style.display = 'block';
            msg.innerHTML = "<h3>System Malfunction</h3><p>" + e.message + "</p><p>Check console or local server settings.</p>";
        });
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // --- Configuration ---
        const CONF = {
            gridColor: 0xff00ff,
            groundColor: 0x0a000f,
            fogColor: 0x000000,
            sunColorTop: new THREE.Color(0xffaa00),
            sunColorBottom: new THREE.Color(0xff0055),
            speed: 1.2
        };

        // --- Scene Setup ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(CONF.fogColor, 0.015); 

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 4, 15); // Default position
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.toneMapping = THREE.ReinhardToneMapping;
        document.body.appendChild(renderer.domElement);

        // --- Post Processing ---
        const renderScene = new RenderPass(scene, camera);
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        bloomPass.threshold = 0;
        bloomPass.strength = 1.8;
        bloomPass.radius = 0.8;
        
        const composer = new EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        // --- Objects ---

        // 1. Moving Grid (The Floor) - SHADER BASED
        const gridGeo = new THREE.PlaneGeometry(400, 400, 20, 20);
        const gridMat = new THREE.ShaderMaterial({
            uniforms: {
                uColor: { value: new THREE.Color(CONF.gridColor) },
                uTime: { value: 0 },
                uSpeed: { value: CONF.speed }
            },
            transparent: true,
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform vec3 uColor;
                uniform float uTime;
                uniform float uSpeed;
                varying vec2 vUv;

                void main() {
                    // Grid logic
                    float size = 40.0; 
                    
                    // Scroll Y - SUPER SLOW SPEED
                    // Reduced multiplier from 0.2 to 0.05
                    vec2 uv = vUv;
                    uv.y += uTime * uSpeed * 0.05; 

                    vec2 grid = fract(uv * size);
                    
                    float thickness = 0.02;
                    float lines = step(grid.x, thickness) + step(grid.y, thickness);
                    
                    float pulse = 1.0 + 0.5 * sin(uTime * 2.0); // Slower pulse too
                    
                    vec3 color = uColor * lines * pulse;
                    float alpha = lines;
                    
                    gl_FragColor = vec4(color, alpha * 0.8);
                }
            `
        });
        const gridPlane = new THREE.Mesh(gridGeo, gridMat);
        gridPlane.rotation.x = -Math.PI / 2;
        gridPlane.position.y = -1;
        scene.add(gridPlane);

        // ... Plane below grid ...
        // Blocking plane below grid
        const planeGeo = new THREE.PlaneGeometry(400, 400);
        const planeMat = new THREE.MeshBasicMaterial({ color: CONF.groundColor, side: THREE.DoubleSide });
        const plane = new THREE.Mesh(planeGeo, planeMat);
        plane.rotation.x = Math.PI / 2;
        plane.position.y = -1.1;
        scene.add(plane);

        // 2. The Sun (Animated Stripes)
        const sunGeometry = new THREE.CircleGeometry(25, 64);
        const sunMaterial = new THREE.ShaderMaterial({
            uniforms: {
                color1: { value: CONF.sunColorTop },
                color2: { value: CONF.sunColorBottom },
                uTime: { value: 0 }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform vec3 color1;
                uniform vec3 color2;
                uniform float uTime;
                varying vec2 vUv;
                void main() {
                    float y = vUv.y;
                    vec3 color = mix(color2, color1, y);
                    
                    // Moving stripes
                    // We offset the sine wave by time
                    float stripe = step(0.05, abs(sin(y * 40.0 - uTime * 2.0)));
                    
                    // Cutout stripes at bottom
                    if (y < 0.6 && stripe < 0.5) discard;

                    gl_FragColor = vec4(color, 1.0);
                }
            `,
            transparent: true
        });
        const sun = new THREE.Mesh(sunGeometry, sunMaterial);
        sun.position.set(0, 10, -100);
        scene.add(sun);

        // 3. Mountains / Terrain (Animated Shader)
        const terrainGeo = new THREE.PlaneGeometry(400, 400, 60, 60);
        
        // Custom shader for terrain to animate vertices
        const terrainMat = new THREE.ShaderMaterial({
            uniforms: {
                uColor: { value: new THREE.Color(0x00ffff) },
                uTime: { value: 0 }
            },
            wireframe: true,
            transparent: true,
            vertexShader: `
                uniform float uTime;
                varying float vElevation;
                
                // Simple pseudo-noise function using sines
                float getElevation(vec2 p, float t) {
                    float h = 0.0;
                    // Layer 1: Main rolling hills (slower, larger)
                    h += sin(p.x * 0.05 + t * 0.2) * sin(p.y * 0.05 + t * 0.2) * 2.0;
                    // Layer 2: Detail bumps
                    h += sin(p.x * 0.15 - t * 0.1) * 1.0;
                    h += cos(p.y * 0.1 + t * 0.3) * 1.0;
                    return h;
                }

                void main() {
                    vec3 pos = position;
                    
                    // Center "Canyon" Flatness
                    float dist = abs(pos.x);
                    float canyonWidth = 30.0;
                    
                    if (dist > canyonWidth) {
                        // Calculate base height based on distance from center
                        float heightFactor = smoothstep(canyonWidth, canyonWidth + 50.0, dist);
                        
                        // Apply noise/undulation
                        // We use world-like coordinates for noise
                        float noise = getElevation(pos.xy, uTime);
                        
                        // Combine: The further out, the higher the hills can be
                        pos.z += (dist * 0.1) + (noise * heightFactor * 1.5);
                    }

                    vElevation = pos.z;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
                }
            `,
            fragmentShader: `
                uniform vec3 uColor;
                varying float vElevation;
                void main() {
                    // Opacity fades out at low elevation to blend with floor
                    float alpha = smoothstep(0.0, 10.0, vElevation) * 0.3 + 0.1;
                    gl_FragColor = vec4(uColor, alpha);
                }
            `
        });
        
        const terrain1 = new THREE.Mesh(terrainGeo, terrainMat);
        terrain1.rotation.x = -Math.PI / 2;
        terrain1.position.y = -5; // Lower slightly to account for wave height
        terrain1.position.z = -100;
        scene.add(terrain1);

        const terrain2 = terrain1.clone();
        terrain2.position.z = -500;
        scene.add(terrain2);

        // 4. Starfield (Warp Speed Effect)
        const starCount = 2000;
        const starGeo = new THREE.BufferGeometry();
        const starPos = [];
        for(let i=0; i<starCount; i++) {
            let x = (Math.random() - 0.5) * 600;
            let y = (Math.random() - 0.5) * 400 + 50; // Keep above horizon mostly
            let z = (Math.random() - 0.5) * 600 - 100;
            starPos.push(x, y, z);
        }
        starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
        const starMat = new THREE.PointsMaterial({color: 0xffffff, size: 0.7});
        const starField = new THREE.Points(starGeo, starMat);
        scene.add(starField);

        // --- Interaction ---
        const mouse = { x: 0, y: 0 };
        const targetCamera = { x: 0, y: 4, z: 15, rotX: -0.1, rotZ: 0 };
        
        document.addEventListener('mousemove', (e) => {
            // Normalize mouse -1 to 1
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        });

        // --- Animation Loop ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            // 1. Move Terrain & Grid
            const moveSpeed = CONF.speed;
            
            terrain1.position.z += moveSpeed;
            terrain2.position.z += moveSpeed;
            // Loop terrain
            if (terrain1.position.z > 300) terrain1.position.z = -500;
            if (terrain2.position.z > 300) terrain2.position.z = -500;

            // Animate Grid Shader
            gridMat.uniforms.uTime.value = time;
            
            // Animate Terrain Shader
            terrainMat.uniforms.uTime.value = time;

            // 2. Animate Sun (Scanlines)
            sunMaterial.uniforms.uTime.value = time;
            // Sun Bobbing
            sun.position.y = 10 + Math.sin(time) * 0.5;

            // 3. Animate Stars
            const positions = starField.geometry.attributes.position.array;
            for(let i=2; i<positions.length; i+=3) {
                positions[i] += moveSpeed * 3; // Stars move faster
                if (positions[i] > 50) {
                    positions[i] = -500; // Reset to far back
                }
            }
            starField.geometry.attributes.position.needsUpdate = true;

            // 4. Interactive Camera (Banking & Looking)
            // Smooth lerp
            targetCamera.x = mouse.x * 5; // Move left/right
            targetCamera.y = 4 + mouse.y * 2; // Move up/down
            targetCamera.rotZ = -mouse.x * 0.1; // Bank angle

            camera.position.x += (targetCamera.x - camera.position.x) * 0.05;
            camera.position.y += (targetCamera.y - camera.position.y) * 0.05;
            camera.rotation.z += (targetCamera.rotZ - camera.rotation.z) * 0.05;
            
            // Look slightly ahead
            camera.lookAt(0, 5, -50);
            // Re-apply banking after lookAt resets rotation
            camera.rotation.z += (targetCamera.rotZ - camera.rotation.z) * 0.05;


            composer.render();
        }

        // Handle Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
